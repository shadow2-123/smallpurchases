[project]
name = "smallpurchases"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "pydantic",
    "sqlalchemy",
    "beautifulsoup4",
    "fastapi",
    "uvicorn"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]